
name: Build Zora Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Zora APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Android SDK - FIXED VERSION
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Install Android SDK platform and build tools
      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Accept Android SDK licences
      - name: Accept SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 6. Grant Gradle execution permission
      - name: Grant Gradle Permission
        run: chmod +x ./gradlew

      # 7. Verify Gradle
      - name: Verify Gradle
        run: ./gradlew --version

      # 8. Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 9. Upload generated APK
      - name: Upload Zora APK
        uses: actions/upload-artifact@v4
        with:
          name: Zora-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
