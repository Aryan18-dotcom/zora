
name: Build Zora Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Zora APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project source
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Configure Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Accept SDK licences
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      # 6. Give Gradle wrapper execution permission
      - name: Grant Gradle Permission
        run: chmod +x ./gradlew

      # 7. Check Gradle configuration
      - name: Verify Gradle
        run: ./gradlew --version

      # 8. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 9. Upload APK
      - name: Upload Zora APK
        uses: actions/upload-artifact@v4
        with:
          name: Zora-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
