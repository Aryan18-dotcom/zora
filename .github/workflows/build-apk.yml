
name: Build Zora Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Zora APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Install SDK packages
      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Locate Android project
      - name: Locate Gradle Wrapper
        shell: bash
        run: |
          echo "Searching for gradlew..."

          WRAPPER=$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found!"
            echo "Repository structure:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          echo "Found Gradle wrapper: $WRAPPER"
          echo "Android project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Grant Gradle permission
      - name: Grant Gradle Permission
        run: chmod +x "$PROJECT_DIR/gradlew"

      # 7. Verify Gradle
      - name: Verify Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      # 8. Build APK
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      # 9. Upload APK
      - name: Upload Zora APK
        uses: actions/upload-artifact@v4
        with:
          name: Zora-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
